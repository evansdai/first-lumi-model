# environment.yml -- the conda environment you already have on your laptop.
#
# This file is the STARTING POINT of the migration, not something LUMI installs.
# On LUMI its job is to tell you what your code imports; the only packages that
# get installed there are the ones the LUMI AI image does not already ship.
# Read README.md, step 3, before you write the extras list.
#
# On your laptop it is an ordinary conda environment:
#
#   conda env create -f environment.yml
#   conda activate first-model
#   python workflow/scripts/train.py --out /tmp/first-run --epochs 30

name: first-model

channels:
  - conda-forge

dependencies:
  - python=3.11        # LUMI's image has 3.12.3 -- a pin like this is dropped
  # One OpenMP runtime only. pip's torch wheel below ships its own libomp.dylib,
  # and conda-forge's default numpy is OpenBLAS built on llvm-openmp: two copies
  # in one process abort with "OMP: Error #15 ... already initialized". This
  # build of OpenBLAS uses pthreads and no OpenMP at all.
  - libopenblas=*=*pthreads*
  - numpy              # on LUMI these come from the image, not from here
  - pandas
  - matplotlib
  - seaborn
  - pip
  - pip:
      # torch from pip: conda-forge builds are CPU-only, and Apple silicon
      # wheels only exist on PyPI. On LUMI you install no torch at all -- the
      # image already contains the ROCm build that is proven on this hardware.
      - torch
      - torchinfo
